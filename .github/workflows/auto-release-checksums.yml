name: Auto Archive & Checksums for Independent Versions

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-all-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process Modules & Generate Independent Versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --all
          branches=$(git branch -r | grep -v 'HEAD' | sed 's/^[[:space:]]*origin\///')
          
          # 获取全局 Release 标签；如果是手动触发则赋一个默认占位符
          GLOBAL_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$GLOBAL_TAG" ]; then
            GLOBAL_TAG="manual-build"
          fi
          
          SUMMARY_FILE="release_summary.md"
          echo "### 📦 各功能模块与独立版本校验" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "触发构建的全局发布版：\`$GLOBAL_TAG\`" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "| 模块 / 分支说明 | 独立版本号 | 文件名 | MD5 校验码 | SHA256 校验码 |" >> "$SUMMARY_FILE"
          echo "| :--- | :--- | :--- | :--- | :--- |" >> "$SUMMARY_FILE"

          for branch in $branches; do
            safe_branch=$(echo "$branch" | tr '/' '_')
            
            # 1. 尝试从该分支根目录读取 VERSION 文件
            branch_version=$(git show "origin/$branch:VERSION" 2>/dev/null | tr -d '[:space:]' || true)
            
            # 如果该分支没有 VERSION 文件，则回退使用全局 Release 标签
            if [ -z "$branch_version" ]; then
              branch_version="$GLOBAL_TAG"
            fi  # 【已修复：原先错误使用了 }】
            
            # 2. 映射模块描述与文件前缀
            case "$branch" in
              "v1.0.0" | "main" | "master")
                module_desc="核心代理模块 (Core)"
                file_prefix="xime_flypy_proxy-core"
                ;;
              "ximenet")
                module_desc="文件管理模块 (Ximenet)"
                file_prefix="xime_flypy_proxy-ximenet"
                ;;
              *)
                module_desc="扩展模块 ($branch)"
                file_prefix="xime_flypy_proxy-${safe_branch}"
                ;;
            esac
            
            # 组合成带有各自独立版本号的文件名
            filename="${file_prefix}-${branch_version}.zip"
            
            echo "----------------------------------------"
            echo "正在打包 [$module_desc] \vert{} 对应分支: $branch | 独立版本: $branch_version ->$filename"
            
            # 打包对应远程分支的纯净源码
            git archive --format=zip "origin/$branch" -o "$filename"
            
            # 计算哈希
            md5_val=$(md5sum "$filename" | awk '{print $1}')
            sha256_val=$(sha256sum "$filename" | awk '{print $1}')
            
            echo "$md5_val" > "${filename}.md5"
            echo "$sha256_val" > "${filename}.sha256"
            
            # 写入 Markdown 表格
            echo "| **$module_desc**<br>(\`$branch\`) | \`$branch_version\` | \`$filename\` | \`$md5_val\` | \`$sha256_val\` |" >> "$SUMMARY_FILE"
          done

          echo "----------------------------------------"

          # 如果是 Release 触发，自动上传所有模块的不同版本资产并更新说明
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "正在上传资产到 Release: $GLOBAL_TAG"
            
            gh release upload "$GLOBAL_TAG" xime_flypy_proxy-*.zip xime_flypy_proxy-*.md5 xime_flypy_proxy-*.sha256 --clobber
            
            # 【已修复：补上了 --json 前缀】
            current_body=$(gh release view "$GLOBAL_TAG" --json body -q .body 2>/dev/null || echo "")
            new_body="$current_body

$(cat "$SUMMARY_FILE")"
            
            gh release edit "$GLOBAL_TAG" --body "$new_body"
            echo "Release 页面更新成功！"
          else
            cat "$SUMMARY_FILE"
          fi

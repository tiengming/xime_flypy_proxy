style:
  color_scheme: starry_night_voyage

# ══════════════════════════════════════════════════════════
#  五套主题配色（v1.1.0）
#  1. 星野夜航（当前使用，保持原样）
#  2. Notion 极简
#  3. Claude 暖砂
#  4. Apple 原生
#  5. Material You 动态
#  v1.1.0：全部配色补齐候选选中色（candidate_selected_text_color），
#          Material You 动态按 M3 2024 基准 token 校准表面色阶
# ══════════════════════════════════════════════════════════
color_schemes:
  # ── 1. 星野夜航 ──
  starry_night_voyage:
    name: "星野夜航"
    primary_color: 0x6D5BD0
    keyboard_background:
      type: gradient
      colors: [0xF0EEFB, 0xE3DFF7]
      colors_dark: [0x0F0C1E, 0x191430]
      angle: 135
    key_bg_color: 0xFAF9FF
    key_bg_color_dark: 0x27FFFFFF
    key_text_color: 0x38305E
    key_text_color_dark: 0xE3DEF7
    candidate_text_color: 0x38305E
    candidate_text_color_dark: 0xE3DEF7
    candidate_selected_text_color: 0x6D5BD0
    candidate_selected_text_color_dark: 0xC9BEFF

  # ── 2. Notion 极简 ──
  # 设计参考：Notion 的暖白背景 + 深墨文字 + Notion 蓝强调色
  notion_style:
    name: "Notion 极简"
    primary_color: 0x2383E2
    keyboard_background:
      type: gradient
      colors: [0xF7F7F5, 0xEFEFED]
      colors_dark: [0x191919, 0x202020]
      angle: 135
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x2F2F2F
    key_text_color: 0x37352F
    key_text_color_dark: 0xE9E9E7
    candidate_text_color: 0x37352F
    candidate_text_color_dark: 0xE9E9E7
    candidate_selected_text_color: 0x1E74CC
    candidate_selected_text_color_dark: 0x7CB9F0

  # ── 3. Claude 暖砂 ──
  # 设计参考：Claude 官网的奶油底色 + 赤陶色强调 + 暖灰文字
  claude_style:
    name: "Claude 暖砂"
    primary_color: 0xD97757
    keyboard_background:
      type: gradient
      colors: [0xF5F4EF, 0xEAE8E0]
      colors_dark: [0x1F1E1D, 0x272624]
      angle: 135
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x33322F
    key_text_color: 0x3D3D3A
    key_text_color_dark: 0xF5F4EF
    candidate_text_color: 0x3D3D3A
    candidate_text_color_dark: 0xF5F4EF
    candidate_selected_text_color: 0xC2603F
    candidate_selected_text_color_dark: 0xE3987B

  # ── 4. Apple 原生 ──
  # 设计参考：iOS 系统键盘的浅灰底 + 纯白按键 + 系统蓝强调
  apple_style:
    name: "Apple 原生"
    primary_color: 0x007AFF
    keyboard_background:
      type: gradient
      colors: [0xD4D6DC, 0xC7CAD2]
      colors_dark: [0x1C1C1E, 0x121214]
      angle: 135
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x363638
    key_text_color: 0x000000
    key_text_color_dark: 0xFFFFFF
    candidate_text_color: 0x000000
    candidate_text_color_dark: 0xFFFFFF
    candidate_selected_text_color: 0x007AFF
    candidate_selected_text_color_dark: 0x0A84FF

  # ── 5. Material You 动态 ──
  # 设计参考：Material Design 3 基准调色板（紫罗兰），自动适配系统亮/暗模式
  # v1.1.0 按 M3 2024 基准 token 校准：亮色 surface→surfaceContainer（#FEF7FF→#F3EDF7），
  # 暗色 surface→surfaceContainer（#141218→#211F26），选中色取 M3 亮色 primary / 暗色 primary
  material_you:
    name: "Material 动态"
    primary_color: 0x6750A4
    keyboard_background:
      type: gradient
      colors: [0xFEF7FF, 0xF3EDF7]
      colors_dark: [0x141218, 0x211F26]
      angle: 135
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x2B2930
    key_text_color: 0x1D1B20
    key_text_color_dark: 0xE6E1E5
    candidate_text_color: 0x1D1B20
    candidate_text_color_dark: 0xE6E1E5
    candidate_selected_text_color: 0x6750A4
    candidate_selected_text_color_dark: 0xD0BCFF

keyboard:
  colors:
    keyboard_bg_color: 0xE3E4E8
    keyboard_bg_color_dark: 0x202020
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x4A4A4A
    candidate_bar_bg_color: 0xE3E4E8
    candidate_bar_bg_color_dark: 0x202020
    key_text_color: 0x202124
    key_text_color_dark: 0xE8EAED
    candidate_text_color: 0x202124
    candidate_text_color_dark: 0xE8EAED

  key:
    corner_radius: 8

  shadow:
    enabled: true
    elevation: 2
# ══════════════════════════════════════════════════════════
#  xime 主题包（xime_theme_pack）v1.2.0
#  15 套配色合并同一份配置（应用内随意切换，互不顶替）：
#   · Material You 家族 ×4（M3 色调结构：紫罗兰/暖玫瑰/海蓝/松绿）
#   · 渐变家族 ×5（3 断点渐变 + 玻璃拟态半透明按键）
#   · 图片背景家族 ×6（银河/晨雾/远山/樱吹雪/星月/海平线，themes/ 原创）
#  自带字体：Maple Mono NL CN（键面，SIL OFL 1.1）+ 霞鹜文楷（候选/注释，SIL OFL 1.1）
#
#  v1.2.0 修复（对照 Xime 3.x 取色逻辑逐项复核）：
#   · 【候选展开页白屏】图片主题的展开候选页背景取 keyboard_bg_color 纯色兜底
#     （图片背景无法映射到该页），未配置时回退白/近黑；银河漫游、星月童话的候选
#     文字是近白色，亮色模式下变成「白底白字」整页不可读。为这两套补上取自背景图
#     的深色 keyboard_bg_color（暗色由应用自动调暗，无需 _dark 字段）。
#   · 【特殊键白字对比不足】特殊键暗色底色默认取 primary_color，应用按「底色亮度
#     >0.5 用按键文字色，否则用 #E8EAED」选文字；月夜金/落日橙/樱粉等亮 primary
#     被判为暗底 → 浅灰字压在亮色键面上（星月 1.87:1、海 2.51:1、樱 2.96:1、
#     银河 3.51:1）。为这些主题补 special_key_bg_color_dark（同色相压暗，≥4.5:1）。
#   · 【候选选中色偏浅】选中胶囊 = 20% 强调色叠在候选栏背景上，部分浅色主题的
#     选中文字对比度仅 1.7~2.7:1。统一压暗到 ≥3:1（色相不变）。
#   · 【深海亮色候选文字】主渐变首断点 #2193B0 上 #0E2A3A 仅 4.16:1（展开页为纯色
#     首断点），候选文字压暗到 #0B2230（4.56:1）；暗色特殊键同步微调。
#   · 【极光梦境暗色键面字】渐变底部青绿段上玻璃键面偏亮，键面字 #E6F2FF 仅 4.45:1，
#     改为纯白 5.05:1。
#  全部配色复核：键面文字 / 候选文字 ≥4.5:1、候选选中色 ≥3:1（亮暗两种模式）。
#  注：银河漫游 / 星月童话的展开候选页「左栏符号」底色来自半透明键色（浅灰），
#  文字跟随候选色（白），约 2.4:1 —— 配置层无独立字段可分栏取色，属应用侧限制。
# ══════════════════════════════════════════════════════════

